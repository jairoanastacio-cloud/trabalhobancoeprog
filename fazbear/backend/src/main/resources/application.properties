spring.datasource.url=jdbc:postgresql://localhost:5432/fazbear
spring.datasource.username=fazbear
spring.datasource.password=fazbear
spring.jpa.hibernate.ddl-auto=update
server.error.include-message=always
fazbear.token.secret=${TOKEN_SECRET:troque-esta-chave-antes-de-publicar}
fazbear.cors.origens=${CORS_ORIGENS:*}
# O Spring também serve o site (pasta ../frontend) em http://localhost:8080
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
